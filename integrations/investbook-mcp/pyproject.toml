[project]
name = "investbook-mcp"
version = "0.1.0"
description = "Read-only local MCP adapter for Investbook"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "httpx==0.28.1"]

[project.scripts]
investbook-mcp = "investbook_mcp.server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
